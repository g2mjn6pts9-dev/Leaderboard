<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leaderboard</title>
  <style>
    :root {
      --bg: #0c1423;
      --surface: #122338;
      --surface-2: #18314d;
      --border: #24476c;
      --text: #eef7ff;
      --muted: #b8cfe4;
      --accent: #ff3b3b;
      --accent-strong: #ff5c5c;
      --green: #34d399;
      --gold: #ffd166;
      --shadow: rgba(0, 0, 0, 0.28);
      --panel: rgba(17, 31, 46, 0.9);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    a { color: var(--accent); }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      background: rgba(12, 20, 35, 0.92);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      backdrop-filter: blur(8px);
    }

    .logo {
      font-weight: 800;
      font-size: 1.5rem;
      letter-spacing: -0.04em;
      color: var(--accent);
    }

    .logo span { color: var(--text); }

    nav {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    nav button {
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: 0.15s ease;
    }

    nav button.active {
      background: var(--surface-2);
      color: var(--text);
    }

    nav button:hover { color: var(--text); }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn, .btn {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface-2);
      color: var(--text);
      cursor: pointer;
      font: inherit;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      font-size: 1.1rem;
    }

    .btn {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
      padding: 9px 16px;
      font-weight: 800;
    }

    .btn.secondary {
      background: var(--surface-2);
      border-color: var(--border);
      color: var(--text);
    }

    main {
      max-width: 1100px;
      width: min(1100px, calc(100% - 32px));
      margin: 0 auto;
      padding: 20px 0 40px;
      flex: 1;
    }

    .source-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 0.82rem;
      margin-bottom: 18px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      background: var(--gold);
    }

    .dot.on { background: var(--green); }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .search-wrap {
      flex: 1 1 260px;
      min-height: 42px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
    }

    .search-wrap input {
      width: 100%;
      padding: 10px 0;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font: inherit;
    }

    .search-wrap input::placeholder { color: var(--muted); }

    select {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font: inherit;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
    }

    .filters button {
      background: var(--surface);
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 7px 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .filters button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .shelf {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 18px;
    }

    .game-card {
      cursor: pointer;
      transition: transform 0.12s ease;
    }

    .game-card:hover { transform: translateY(-3px); }

    .cover {
      position: relative;
      aspect-ratio: 3 / 4;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: linear-gradient(135deg, #1a3a5a, #0f1d2c);
      display: flex;
      align-items: flex-end;
      justify-content: flex-start;
      padding: 10px;
      box-shadow: 0 10px 20px var(--shadow);
    }

    .cover img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .cover .shade {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(7, 12, 20, 0.85), rgba(7, 12, 20, 0.12));
    }

    .cover .badge {
      position: absolute;
      right: 8px;
      top: 8px;
      z-index: 2;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.6);
      color: white;
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .favorite-btn {
      position: absolute;
      left: 8px;
      top: 8px;
      z-index: 3;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.4);
      background: rgba(10, 8, 18, 0.45);
      color: white;
      display: grid;
      place-items: center;
      font-size: 1rem;
      cursor: pointer;
    }

    .favorite-btn.on { color: var(--gold); }

    .cover .initial {
      position: relative;
      z-index: 1;
      font-size: 2rem;
      font-weight: 800;
      color: rgba(255,255,255,0.82);
    }

    .game-card h3 {
      margin: 8px 0 4px;
      font-size: 0.94rem;
      line-height: 1.3;
    }

    .meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.74rem;
      color: var(--muted);
    }

    .recent-tag {
      color: var(--green);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-size: 0.6rem;
    }

    .stars {
      margin-top: 6px;
      color: var(--gold);
      letter-spacing: 0.08em;
      font-size: 0.82rem;
    }

    .empty-state {
      text-align: center;
      padding: 52px 20px;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      margin-top: 8px;
    }

    .empty-state h2 { color: var(--text); }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 8px 18px var(--shadow);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 18px;
      margin-top: 18px;
    }

    .stat-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 18px;
    }

    .stat-chip {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      color: var(--muted);
      font-size: 0.85rem;
      min-width: 110px;
    }

    .stat-chip b {
      color: var(--text);
      font-size: 1.1rem;
      margin-left: 6px;
    }

    .leaderboard-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .leader-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .leader-item:last-child { border-bottom: none; }

    .leader-rank {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--surface-2);
      font-weight: 800;
      font-size: 0.78rem;
    }

    .leader-name {
      flex: 1;
      font-weight: 700;
    }

    .leader-hours {
      color: var(--muted);
      font-size: 0.75rem;
    }

    .feed {
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-width: 760px;
    }

    .activity-item {
      display: flex;
      gap: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #7c42ff);
      display: grid;
      place-items: center;
      font-weight: 800;
      flex-shrink: 0;
    }

    .activity-item .meta {
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .activity-item strong { font-size: 0.9rem; }

    .activity-item p {
      margin: 6px 0 0;
      color: #dfeaf6;
      line-height: 1.5;
      font-size: 0.92rem;
    }

    .profile-layout {
      display: grid;
      gap: 18px;
      grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr);
    }

    .profile-card {
      background: var(--surface);
      border-radius: 16px;
      border: 1px solid var(--border);
      padding: 22px;
      box-shadow: 0 8px 18px var(--shadow);
    }

    .profile-header {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 18px;
    }

    .profile-avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--gold), var(--accent));
      font-size: 1.5rem;
      font-weight: 800;
      flex-shrink: 0;
    }

    .profile-label {
      display: block;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin: 10px 0 6px;
      color: var(--muted);
      font-weight: 800;
    }

    input[type="text"], textarea {
      width: 100%;
      background: rgba(12, 20, 35, 0.45);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      padding: 10px 12px;
      font: inherit;
      resize: vertical;
    }

    textarea { min-height: 90px; }

    .top5-box {
      background: rgba(12, 20, 35, 0.35);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }

    .top5-box h3 {
      margin: 0 0 12px;
      font-size: 1rem;
      letter-spacing: 0.04em;
    }

    .top5-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .top5-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
    }

    .top5-item .game-name {
      font-weight: 800;
      flex: 1;
    }

    .top5-item button {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 6px 8px;
      cursor: pointer;
    }

    .muted-note {
      color: var(--muted);
      font-size: 0.85rem;
      line-height: 1.5;
      margin-top: 14px;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(7, 12, 20, 0.8);
      display: none;
      align-items: flex-start;
      justify-content: center;
      z-index: 50;
      padding: 40px 16px;
      overflow-y: auto;
    }

    .overlay.open { display: flex; }

    .modal {
      width: min(500px, 100%);
      background: var(--surface);
      border-radius: 16px;
      border: 1px solid var(--border);
      padding: 20px 18px 18px;
      box-shadow: 0 14px 30px rgba(0,0,0,0.35);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .modal h2 {
      margin: 0;
      font-size: 1.2rem;
    }

    .close-x {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 1.8rem;
      cursor: pointer;
      line-height: 1;
      padding: 0;
    }

    .modal p.sub {
      margin: 0 0 16px;
      color: var(--muted);
      line-height: 1.5;
      font-size: 0.85rem;
    }

    .status-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }

    .status-row button, .toggle-btn {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 999px;
      padding: 7px 10px;
      cursor: pointer;
      font: inherit;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .status-row button.active, .toggle-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    .toggle-row {
      display: flex;
      margin: 6px 0 12px;
    }

    .toggle-btn {
      border-radius: 10px;
      padding: 8px 12px;
    }

    .star-rating {
      display: flex;
      gap: 4px;
      font-size: 1.7rem;
      user-select: none;
      margin: 2px 0 6px;
    }

    .star-rating span {
      color: rgba(255,255,255,0.12);
      cursor: pointer;
      transition: color 0.12s ease;
    }

    .star-rating span.on { color: var(--gold); }

    .modal-actions {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 18px;
    }

    .danger {
      background: transparent;
      border: 1px solid #ff6b6b;
      color: #ff9a9a;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 72px;
      transform: translateX(-50%);
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 18px;
      border-radius: 12px;
      opacity: 0;
      transition: opacity 0.2s ease;
      z-index: 100;
      pointer-events: none;
      font-weight: 700;
    }

    .toast.show { opacity: 1; }

    @media (max-width: 760px) {
      header {
        flex-wrap: wrap;
        justify-content: center;
      }

      .profile-layout {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 560px) {
      .shelf {
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      }

      nav {
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">leader<span>board</span></div>
    <nav>
      <button id="tab-library" class="active" onclick="switchTab('library')">Library</button>
      <button id="tab-wishlist" onclick="switchTab('wishlist')">Wishlist</button>
      <button id="tab-activity" onclick="switchTab('activity')">Activity</button>
      <button id="tab-stats" onclick="switchTab('stats')">Stats</button>
      <button id="tab-profile" onclick="switchTab('profile')">Profile</button>
    </nav>
    <div class="header-actions">
      <button class="icon-btn" id="themeToggle" onclick="toggleTheme()" title="Theme toggle">🌙</button>
      <button class="btn" onclick="openAddModal()">+ Log</button>
    </div>
  </header>

  <main>
    <div class="source-bar" id="sourceBar"></div>

    <section id="view-library">
      <div class="toolbar">
        <div class="search-wrap">
          <span aria-hidden="true">🔎</span>
          <input id="librarySearch" type="text" placeholder="Search your library..." oninput="setSearchQuery(this.value)" />
        </div>
        <select id="sortSelect" onchange="setSortMode(this.value)">
          <option value="recent">Recently added</option>
          <option value="title">Title</option>
          <option value="rating">Rating</option>
          <option value="hours">Hours</option>
          <option value="status">Status</option>
        </select>
      </div>
      <div class="filters" id="filters"></div>
      <div class="shelf" id="libraryShelf"></div>
      <div class="empty-state" id="emptyState" style="display:none">
        <h2>Your library is empty</h2>
        <p>Hit “+ Log” and add your first game.</p>
      </div>
    </section>

    <section id="view-wishlist" style="display:none">
      <div class="shelf" id="wishlistShelf"></div>
    </section>

    <section id="view-activity" style="display:none">
      <div class="feed" id="feed"></div>
    </section>

    <section id="view-stats" style="display:none">
      <div class="stat-row" id="statsSummary"></div>
      <div class="stats-grid">
        <div class="panel" id="leaderboardPanel"></div>
        <div class="panel" id="ratingPanel"></div>
      </div>
    </section>

    <section id="view-profile" style="display:none">
      <div class="profile-layout">
        <div class="profile-card">
          <div class="profile-header">
            <div class="profile-avatar" id="profileAvatar">U</div>
            <div style="flex:1">
              <label class="profile-label">Username</label>
              <input id="profileUsername" type="text" placeholder="Your username" />
            </div>
          </div>

          <label class="profile-label">Bio</label>
          <textarea id="profileBio" placeholder="Tell people about your gaming life..."></textarea>
          <p class="muted-note">Top 5 games are a separate status from favorites. A game can be favorited without being in your Top 5 list.</p>
        </div>

        <div class="top5-box profile-card">
          <h3>Top 5 games</h3>
          <div class="top5-list" id="top5List"></div>
        </div>
      </div>
    </section>
  </main>

  <div class="overlay" id="addOverlay">
    <div class="modal">
      <div class="modal-header">
        <h2>Log a game</h2>
        <button class="close-x" onclick="closeModal('addOverlay')">&times;</button>
      </div>
      <p class="sub">Add a game to your library or save a quick title.</p>
      <input id="manualTitle" type="text" placeholder="Game title" />
      <label class="profile-label">Year</label>
      <input id="manualYear" type="text" placeholder="2024" />
      <label class="profile-label">Platform</label>
      <input id="manualPlatform" type="text" placeholder="PC, Switch, PS5..." />
      <div class="modal-actions">
        <span></span>
        <button class="btn" onclick="addManualGame()">Add to library</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="detailOverlay">
    <div class="modal">
      <div class="modal-header">
        <h2 id="detailTitle">Game</h2>
        <button class="close-x" onclick="closeModal('detailOverlay')">&times;</button>
      </div>
      <p class="sub" id="detailMeta">Meta</p>

      <label class="profile-label">Status</label>
      <div class="status-row" id="statusRow"></div>

      <label class="profile-label">Wishlist</label>
      <div class="toggle-row">
        <button id="wishlistToggle" class="toggle-btn" onclick="toggleWishlist()">Add to wishlist</button>
      </div>

      <label class="profile-label">Top 5</label>
      <div class="toggle-row">
        <button id="top5Toggle" class="toggle-btn" onclick="toggleTop5Status()">Add to Top 5</button>
      </div>

      <label class="profile-label">Rating</label>
      <div class="star-rating" id="detailRating"></div>

      <label class="profile-label">Hours (optional)</label>
      <input id="detailHours" type="text" placeholder="e.g. 34" oninput="saveHours()" />

      <label class="profile-label">Review</label>
      <textarea id="detailReview" placeholder="One-liner or a rant." oninput="saveReview()"></textarea>

      <label class="profile-label">Notes</label>
      <textarea id="detailNotes" placeholder="Personal notes..." oninput="saveNotes()"></textarea>

      <div class="modal-actions">
        <button class="btn danger" onclick="removeEntry()">Remove</button>
        <button class="btn" onclick="closeModal('detailOverlay')">Done</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    "use strict";

    const LS_KEY = "leaderboard_state_v1";
    const STATUSES = ["Playing", "Completed", "Backlog", "On Hold", "Dropped", "Endless"];
    const PALETTE = ["#ff3b3b", "#1fbf7a", "#3b82f6", "#f59e0b", "#8b5cf6", "#00b8d9"];

    const defaultEntries = [
      { id: 1, title: "Elden Ring", year: 2022, platform: "PC", status: "Playing", hours: 42, rating: 9, favorite: true, top5: true, wishlist: false, review: "Beautifully brutal. ", notes: "Need to finish the final area.", image: "", added: Date.now() - 1000 * 60 * 60 * 48 },
      { id: 2, title: "Hades", year: 2020, platform: "PC", status: "Completed", hours: 31, rating: 10, favorite: false, top5: true, wishlist: false, review: "A perfect escalation loop.", notes: "Still one run to go.", image: "", added: Date.now() - 1000 * 60 * 60 * 24 * 3 },
      { id: 3, title: "Celeste", year: 2018, platform: "Switch", status: "Completed", hours: 18, rating: 9, favorite: true, top5: false, wishlist: false, review: "The story lands hard.", notes: "One of the best platformers.", image: "", added: Date.now() - 1000 * 60 * 60 * 6 },
      { id: 4, title: "Outer Wilds", year: 2019, platform: "PC", status: "Backlog", hours: 8, rating: 10, favorite: false, top5: true, wishlist: false, review: "Weird, brilliant, and short.", notes: "I keep meaning to sit down with it.", image: "", added: Date.now() - 1000 * 60 * 60 * 24 * 10 }
    ];

    const state = {
      entries: [],
      profile: { username: "", bio: "" },
      view: "library",
      filter: "All",
      search: "",
      sort: "recent",
      currentId: null,
      theme: "dark"
    };

    function loadState() {
      try {
        const raw = localStorage.getItem(LS_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          state.entries = Array.isArray(parsed.entries) && parsed.entries.length ? parsed.entries : [...defaultEntries];
          state.profile = Object.assign({ username: "", bio: "" }, parsed.profile || {});
          if (parsed.view) state.view = parsed.view;
          if (parsed.filter) state.filter = parsed.filter;
          if (parsed.search) state.search = parsed.search;
          if (parsed.sort) state.sort = parsed.sort;
          if (parsed.theme) state.theme = parsed.theme;
        } else {
          state.entries = [...defaultEntries];
        }
      } catch (e) {
        state.entries = [...defaultEntries];
      }
    }

    function persistState() {
      localStorage.setItem(LS_KEY, JSON.stringify({
        entries: state.entries,
        profile: state.profile,
        view: state.view,
        filter: state.filter,
        search: state.search,
        sort: state.sort,
        theme: state.theme
      }));
    }

    function esc(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function coverColor(title) {
      let hash = 0;
      for (const char of String(title || "")) hash = (hash * 31 + char.charCodeAt(0)) % 997;
      return PALETTE[hash % PALETTE.length];
    }

    function safeImg(url) {
      if (!url || typeof url !== "string") return "";
      return /^https?:\/\//i.test(url) ? url : "";
    }

    function stars(value) {
      if (!value) return "";
      let out = "";
      for (let i = 1; i <= 10; i++) out += i <= Number(value) ? "★" : '<span class="off">★</span>';
      return out;
    }

    function toast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(el._timer);
      el._timer = setTimeout(() => el.classList.remove("show"), 2200);
    }

    function setTheme(value) {
      state.theme = value === "light" ? "light" : "dark";
      document.body.classList.toggle("theme-light", state.theme === "light");
      const btn = document.getElementById("themeToggle");
      if (btn) btn.textContent = state.theme === "light" ? "☀️" : "🌙";
      persistState();
    }

    function toggleTheme() {
      setTheme(state.theme === "light" ? "dark" : "light");
      toast(state.theme === "light" ? "Light mode enabled" : "Dark mode enabled");
    }

    function switchTab(tabName) {
      state.view = tabName;
      document.getElementById("tab-library").classList.toggle("active", tabName === "library");
      document.getElementById("tab-wishlist").classList.toggle("active", tabName === "wishlist");
      document.getElementById("tab-activity").classList.toggle("active", tabName === "activity");
      document.getElementById("tab-stats").classList.toggle("active", tabName === "stats");
      document.getElementById("tab-profile").classList.toggle("active", tabName === "profile");

      document.getElementById("view-library").style.display = tabName === "library" ? "" : "none";
      document.getElementById("view-wishlist").style.display = tabName === "wishlist" ? "" : "none";
      document.getElementById("view-activity").style.display = tabName === "activity" ? "" : "none";
      document.getElementById("view-stats").style.display = tabName === "stats" ? "" : "none";
      document.getElementById("view-profile").style.display = tabName === "profile" ? "" : "none";

      render();
      persistState();
    }

    function setSearchQuery(value) {
      state.search = value || "";
      persistState();
      render();
    }

    function setSortMode(value) {
      state.sort = value || "recent";
      persistState();
      render();
    }

    function getVisibleEntries() {
      const query = (state.search || "").trim().toLowerCase();
      let list = [...state.entries];

      if (state.view === "wishlist") {
        list = list.filter(entry => entry.wishlist);
      }

      if (state.filter === "Favorites") list = list.filter(entry => entry.favorite);
      else if (state.filter === "Recent") list = list.filter(entry => entry.added && Date.now() - Number(entry.added) <= 30 * 24 * 60 * 60 * 1000);
      else if (state.filter === "Wishlist") list = list.filter(entry => entry.wishlist);
      else if (STATUSES.includes(state.filter)) list = list.filter(entry => entry.status === state.filter);

      const needle = query;
      if (needle) {
        list = list.filter(entry => [entry.title, entry.platform, entry.status, entry.notes, entry.review].join(" ").toLowerCase().includes(needle));
      }

      list.sort((a, b) => {
        switch (state.sort) {
          case "title":
            return String(a.title).localeCompare(String(b.title)) || Number(b.added || 0) - Number(a.added || 0);
          case "rating":
            return Number(b.rating || 0) - Number(a.rating || 0) || Number(b.added || 0) - Number(a.added || 0);
          case "hours":
            return Number(b.hours || 0) - Number(a.hours || 0) || Number(b.added || 0) - Number(a.added || 0);
          case "status":
            return STATUSES.indexOf(a.status) - STATUSES.indexOf(b.status) || Number(b.added || 0) - Number(a.added || 0);
          case "recent":
          default:
            return Number(b.added || 0) - Number(a.added || 0);
        }
      });

      return list;
    }

    function renderFilters() {
      const base = ["All", "Favorites", "Recent", ...STATUSES];
      const existing = new Set(base);
      const platformNames = [...new Set(state.entries.map(entry => entry.platform).filter(Boolean))].sort();
      const options = [...base, ...platformNames.filter(p => !existing.has(p)), "Wishlist"];
      document.getElementById("filters").innerHTML = options.map(value => {
        const active = value === state.filter ? "active" : "";
        return `<button class="${active}" onclick="setFilter('${value}')">${value}</button>`;
      }).join("");
    }

    function setFilter(value) {
      state.filter = value;
      persistState();
      render();
    }

    function renderSourceBar() {
      document.getElementById("sourceBar").innerHTML = '<span class="dot on"></span> Local browser data only';
    }

    function renderLibrary() {
      const shelf = document.getElementById("libraryShelf");
      const empty = document.getElementById("emptyState");
      const list = getVisibleEntries();

      shelf.innerHTML = list.map(entry => {
        const img = safeImg(entry.image);
        const bg = img ? "" : `background:${coverColor(entry.title)}`;
        const topBadge = entry.top5 ? '<span class="badge" style="color:#ffd166;">Top 5</span>' : `<span class="badge" style="color:${statusColor(entry.status)}">${esc(entry.status)}</span>`;
        const favorite = entry.favorite ? '★' : '☆';
        const recentTag = entry.added && Date.now() - Number(entry.added) <= 7 * 24 * 60 * 60 * 1000 ? '<span class="recent-tag">New</span>' : '';
        const inner = img ? `<img src="${img}" alt="${esc(entry.title)}" /><div class="shade"></div>` : `<div class="shade"></div>`;

        return `
          <div class="game-card" onclick="openDetail(${entry.id})">
            <div class="cover" style="${bg}">
              <button class="favorite-btn ${entry.favorite ? "on" : ""}" onclick="toggleFavorite(event, ${entry.id})">${favorite}</button>
              ${topBadge}
              ${inner}
              ${!img ? `<span class="initial">${esc((entry.title || "?").slice(0, 2).toUpperCase())}</span>` : ""}
            </div>
            <h3>${esc(entry.title)}</h3>
            <div class="meta-row">
              <span>${esc(entry.year || "")}${entry.hours ? ` · ${esc(entry.hours)}h` : ""}</span>
              ${recentTag}
            </div>
            ${entry.rating ? `<div class="stars">${stars(entry.rating)}</div>` : ""}
          </div>
        `;
      }).join("");

      empty.style.display = state.entries.length ? "none" : "";
      shelf.style.display = list.length ? "" : "none";
    }

    function renderWishlist() {
      const box = document.getElementById("wishlistShelf");
      const list = state.entries.filter(entry => entry.wishlist);
      box.innerHTML = list.length ? list.map(entry => {
        const img = safeImg(entry.image);
        const bg = img ? "" : `background:${coverColor(entry.title)}`;
        const inner = img ? `<img src="${img}" alt="${esc(entry.title)}" /><div class="shade"></div>` : `<div class="shade"></div>`;
        return `
          <div class="game-card" onclick="openDetail(${entry.id})">
            <div class="cover" style="${bg}">
              <span class="badge" style="color:${statusColor(entry.status)}">Wish</span>
              ${inner}
              ${!img ? `<span class="initial">${esc((entry.title || "?").slice(0, 2).toUpperCase())}</span>` : ""}
            </div>
            <h3>${esc(entry.title)}</h3>
            <div class="meta-row"><span>${esc(entry.year || "")}</span></div>
          </div>
        `;
      }).join("") : '<div class="empty-state" style="width:100%"><h2>No wishlist entries</h2><p>Mark a game as wishlist from its detail view.</p></div>';
    }

    function renderActivity() {
      const feed = document.getElementById("feed");
      const items = state.entries
        .filter(entry => entry.review || entry.notes || entry.status)
        .slice(0, 8)
        .map(entry => `
          <div class="activity-item">
            <div class="avatar">${esc((entry.title || "?").slice(0, 1).toUpperCase())}</div>
            <div>
              <div class="meta">${esc(entry.status)} · ${new Date(entry.added || Date.now()).toLocaleDateString()}</div>
              <strong>${esc(entry.title)}</strong>
              ${entry.review ? `<p>${esc(entry.review)}</p>` : ""}
              ${entry.notes ? `<p><em>${esc(entry.notes)}</em></p>` : ""}
            </div>
          </div>
        `)
        .join("");

      feed.innerHTML = items || '<div class="panel"><p class="muted-note">Log a few games to populate activity.</p></div>';
    }

    function renderStats() {
      const counts = {};
      for (const entry of state.entries) counts[entry.status] = (counts[entry.status] || 0) + 1;
      const rated = state.entries.filter(entry => Number(entry.rating) > 0);
      const avg = rated.length ? (rated.reduce((sum, entry) => sum + Number(entry.rating), 0) / rated.length).toFixed(1) : "—";
      const topGames = [...state.entries].filter(entry => Number(entry.hours) > 0).sort((a, b) => Number(b.hours) - Number(a.hours)).slice(0, 3);

      document.getElementById("statsSummary").innerHTML = [
        `<div class="stat-chip">Games <b>${state.entries.length}</b></div>`,
        `<div class="stat-chip">Completed <b>${counts.Completed || 0}</b></div>`,
        `<div class="stat-chip">Playing <b>${counts.Playing || 0}</b></div>`,
        `<div class="stat-chip">Avg rating <b>${avg}</b></div>`,
        `<div class="stat-chip">Wishlist <b>${state.entries.filter(entry => entry.wishlist).length}</b></div>`
      ].join("");

      const leaderboard = document.getElementById("leaderboardPanel");
      leaderboard.innerHTML = topGames.length ? `
        <h3>Most played</h3>
        <div class="leaderboard-list">
          ${topGames.map((entry, index) => `
            <div class="leader-item">
              <span class="leader-rank">${index + 1}</span>
              <span class="leader-name">${esc(entry.title)}</span>
              <span class="leader-hours">${entry.hours}h</span>
            </div>
          `).join("")}
        </div>
      ` : '<h3>Most played</h3><p class="muted-note">Add hours to games to unlock the leaderboard.</p>';

      const ratingPanel = document.getElementById("ratingPanel");
      const bucket = Array.from({ length: 10 }, (_, index) => index + 1).map(score => ({ score, count: state.entries.filter(entry => Number(entry.rating) === score).length }));
      const max = Math.max(...bucket.map(item => item.count), 1);
      ratingPanel.innerHTML = `
        <h3>Ratings</h3>
        <div class="leaderboard-list">
          ${bucket.map(item => `
            <div class="leader-item">
              <span class="leader-rank" style="width:26px; height:26px;">${item.score}</span>
              <div style="flex:1; position:relative; height:10px; border-radius:999px; background: rgba(255,255,255,0.06); overflow:hidden; border:1px solid var(--border);">
                <div style="position:absolute; inset:0 auto 0 0; width:${(item.count / max) * 100}%; background:linear-gradient(90deg, var(--gold), var(--accent)); border-radius:inherit;"></div>
              </div>
              <span class="leader-hours">${item.count}</span>
            </div>
          `).join("")}
        </div>
      `;
    }

    function renderProfile() {
      const usernameInput = document.getElementById("profileUsername");
      const bioInput = document.getElementById("profileBio");
      const avatar = document.getElementById("profileAvatar");
      const top5List = document.getElementById("top5List");

      usernameInput.value = state.profile.username || "";
      bioInput.value = state.profile.bio || "";
      avatar.textContent = (state.profile.username || "U").slice(0, 1).toUpperCase();

      const top5 = state.entries.filter(entry => entry.top5).slice(0, 5);
      top5List.innerHTML = top5.length ? top5.map(entry => `
        <div class="top5-item">
          <div class="game-name">${esc(entry.title)}</div>
          <button onclick="openDetail(${entry.id})">View</button>
        </div>
      `).join("") : '<p class="muted-note">No games selected yet. Open a game and toggle “Top 5” to add it here.</p>';
    }

    function render() {
      renderSourceBar();
      renderFilters();
      renderLibrary();
      renderWishlist();
      renderActivity();
      renderStats();
      renderProfile();

      document.getElementById("librarySearch").value = state.search || "";
      document.getElementById("sortSelect").value = state.sort || "recent";
      setTheme(state.theme);
    }

    function statusColor(status) {
      const map = {
        "Playing": "#3b82f6",
        "Completed": "#22c55e",
        "Backlog": "#a5bfd3",
        "On Hold": "#fbbf24",
        "Dropped": "#ef4444",
        "Endless": "#8b5cf6"
      };
      return map[status] || "#ffffff";
    }

    function openAddModal() {
      document.getElementById("addOverlay").classList.add("open");
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove("open");
    }

    function addManualGame() {
      const title = document.getElementById("manualTitle").value.trim();
      const year = document.getElementById("manualYear").value.trim();
      const platform = document.getElementById("manualPlatform").value.trim();
      if (!title) {
        toast("Add a game title first.");
        return;
      }

      const entry = {
        id: Date.now() + Math.random(),
        title,
        year: year || new Date().getFullYear(),
        platform: platform || "PC",
        status: "Playing",
        hours: "",
        rating: 0,
        favorite: false,
        top5: false,
        wishlist: false,
        review: "",
        notes: "",
        image: "",
        added: Date.now()
      };

      state.entries.unshift(entry);
      persistState();
      closeModal("addOverlay");
      document.getElementById("manualTitle").value = "";
      document.getElementById("manualYear").value = "";
      document.getElementById("manualPlatform").value = "";
      render();
      toast("Game added to library.");
    }

    function openDetail(id) {
      const entry = state.entries.find(item => Number(item.id) === Number(id));
      if (!entry) return;
      state.currentId = Number(id);

      document.getElementById("detailTitle").textContent = entry.title;
      document.getElementById("detailMeta").textContent = [entry.year || "Unknown", entry.platform || "PC"].filter(Boolean).join(" • ");

      const row = document.getElementById("statusRow");
      row.innerHTML = STATUSES.map(status => `
        <button class="${entry.status === status ? "active" : ""}" onclick="setStatus('${status}')">${status}</button>
      `).join("");

      const wishlistButton = document.getElementById("wishlistToggle");
      wishlistButton.textContent = entry.wishlist ? "In wishlist" : "Add to wishlist";
      wishlistButton.classList.toggle("active", !!entry.wishlist);

      const topButton = document.getElementById("top5Toggle");
      topButton.textContent = entry.top5 ? "In Top 5" : "Add to Top 5";
      topButton.classList.toggle("active", !!entry.top5);

      const starsEl = document.getElementById("detailRating");
      starsEl.innerHTML = Array.from({ length: 10 }, (_, index) => {
        const value = index + 1;
        return `<span class="${value <= Number(entry.rating || 0) ? "on" : ""}" data-value="${value}" onclick="setRating(${value})">★</span>`;
      }).join("");

      document.getElementById("detailHours").value = entry.hours || "";
      document.getElementById("detailReview").value = entry.review || "";
      document.getElementById("detailNotes").value = entry.notes || "";

      document.getElementById("detailOverlay").classList.add("open");
    }

    function setStatus(status) {
      const entry = state.entries.find(item => Number(item.id) === Number(state.currentId));
      if (!entry) return;
      entry.status = status;
      entry.added = entry.added || Date.now();
      persistState();
      render();
      openDetail(entry.id);
    }

    function toggleWishlist() {
      const entry = state.entries.find(item => Number(item.id) === Number(state.currentId));
      if (!entry) return;
      entry.wishlist = !entry.wishlist;
      persistState();
      render();
      openDetail(entry.id);
    }

    function toggleTop5Status() {
      const entry = state.entries.find(item => Number(item.id) === Number(state.currentId));
      if (!entry) return;
      const count = state.entries.filter(item => item.top5).length;

      if (!entry.top5 && count >= 5) {
        toast("Your Top 5 is full. Remove one before adding another.");
        return;
      }

      entry.top5 = !entry.top5;
      persistState();
      render();
      openDetail(entry.id);
    }

    function setRating(value) {
      const entry = state.entries.find(item => Number(item.id) === Number(state.currentId));
      if (!entry) return;
      entry.rating = value;
      persistState();
      render();
      openDetail(entry.id);
    }

    function saveHours() {
      const entry = state.entries.find(item => Number(item.id) === Number(state.currentId));
      if (!entry) return;
      entry.hours = document.getElementById("detailHours").value.trim();
      persistState();
      render();
    }

    function saveReview() {
      const entry = state.entries.find(item => Number(item.id) === Number(state.currentId));
      if (!entry) return;
      entry.review = document.getElementById("detailReview").value;
      persistState();
      render();
    }

    function saveNotes() {
      const entry = state.entries.find(item => Number(item.id) === Number(state.currentId));
      if (!entry) return;
      entry.notes = document.getElementById("detailNotes").value;
      persistState();
      render();
    }

    function toggleFavorite(event, id) {
      event.stopPropagation();
      const entry = state.entries.find(item => Number(item.id) === Number(id));
      if (!entry) return;
      entry.favorite = !entry.favorite;
      persistState();
      render();
    }

    function removeEntry() {
      const entry = state.entries.find(item => Number(item.id) === Number(state.currentId));
      if (!entry) return;
      state.entries = state.entries.filter(item => Number(item.id) !== Number(entry.id));
      persistState();
      closeModal("detailOverlay");
      render();
      toast("Game removed from library.");
    }

    document.getElementById("profileUsername").addEventListener("input", (event) => {
      state.profile.username = event.target.value;
      persistState();
      renderProfile();
    });

    document.getElementById("profileBio").addEventListener("input", (event) => {
      state.profile.bio = event.target.value;
      persistState();
    });

    loadState();
    render();
    switchTab(state.view);
  </script>
</body>
</html>
